<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAM · Parser de Comprovantes</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0d0f12; --surface:#141720; --surface2:#1c2030;
            --border:#252a38; --border2:#2e3448;
            --accent:#00d4ff; --green:#00e676; --yellow:#ffd740; --red:#ff5252;
            --text:#e8ecf4; --muted:#6b7599; --muted2:#8892b0; --radius:10px;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:32px 24px; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
        .container { max-width:680px; margin:0 auto; position:relative; z-index:1; }

        .header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:36px; padding-bottom:24px; border-bottom:1px solid var(--border); }
        .logo-tag { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--accent); letter-spacing:3px; text-transform:uppercase; opacity:0.8; }
        .logo-title { font-size:2rem; font-weight:700; letter-spacing:-0.5px; line-height:1; }
        .logo-title span { color:var(--accent); }
        .status-pill { display:inline-flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border2); padding:6px 12px; border-radius:20px; font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--muted2); }
        .status-pill .dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

        .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; margin-bottom:20px; position:relative; overflow:hidden; }
        .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent),transparent 60%); opacity:0.4; }
        .card-header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
        .card-num { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--accent); background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.2); padding:3px 8px; border-radius:4px; }
        .card-title { font-size:1rem; font-weight:600; }

        .dropzone { border:1.5px dashed var(--border2); border-radius:var(--radius); padding:48px 20px; text-align:center; cursor:pointer; transition:all 0.2s; background:var(--surface2); margin-bottom:20px; }
        .dropzone:hover, .dropzone.dragover { border-color:var(--accent); background:rgba(0,212,255,0.05); }
        .dropzone.success { border-color:var(--green); border-style:solid; background:rgba(0,230,118,0.05); }
        .dropzone.loading { opacity:0.5; pointer-events:none; }
        .drop-icon { font-size:2.4rem; margin-bottom:12px; display:block; }
        .drop-label { font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--accent); text-transform:uppercase; letter-spacing:1.5px; display:block; margin-bottom:8px; }
        .drop-hint { font-size:0.82rem; color:var(--muted); }
        .dropzone.success .drop-hint { color:var(--green); font-weight:500; }

        .btn-process { width:100%; padding:16px; background:var(--accent); color:#000; border:none; border-radius:var(--radius); font-family:'IBM Plex Sans',sans-serif; font-size:0.95rem; font-weight:700; letter-spacing:0.5px; cursor:pointer; transition:all 0.2s; text-transform:uppercase; }
        .btn-process:hover:not(:disabled) { background:#33dcff; transform:translateY(-1px); box-shadow:0 4px 20px rgba(0,212,255,0.3); }
        .btn-process:disabled { background:var(--border2); color:var(--muted); cursor:not-allowed; }

        .log-box { background:#080a0e; border:1px solid var(--border); border-radius:8px; padding:16px; height:180px; overflow-y:auto; margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; display:none; }
        .log-box.active { display:block; }
        .log-line { color:var(--muted2); margin-bottom:5px; line-height:1.5; }
        .log-line::before { content:'> '; color:var(--accent); }
        .log-line.done { color:var(--green); }
        .log-line.error { color:var(--red); }

        .btn-download { width:100%; padding:16px; background:transparent; color:var(--green); border:1.5px solid var(--green); border-radius:var(--radius); font-family:'IBM Plex Sans',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s; text-transform:uppercase; margin-top:16px; display:none; }
        .btn-download:hover { background:rgba(0,230,118,0.1); box-shadow:0 0 20px rgba(0,230,118,0.2); }
        .btn-download.visible { display:block; }

        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <div class="logo-tag">FAM · Sistema</div>
            <div class="logo-title">Compro<span>vantes</span></div>
        </div>
        <div class="status-pill"><span class="dot"></span>Online · porta 5002</div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-num">01</span>
            <span class="card-title">Upload do ZIP Mensal</span>
        </div>

        <div class="dropzone" id="drop-zip" onclick="document.getElementById('file-zip').click()">
            <span class="drop-icon">📦</span>
            <span class="drop-label">ZIP de Comprovantes</span>
            <span class="drop-hint" id="hint-zip">Arraste o arquivo .zip aqui ou clique para selecionar</span>
        </div>
        <input type="file" id="file-zip" accept=".zip" style="display:none">

        <button class="btn-process" id="btn-process" disabled onclick="processar()">
            Gerar Planilha
        </button>

        <div class="log-box" id="log-box"></div>
        <button class="btn-download" id="btn-download" onclick="downloadFile()">
            ⬇ Baixar Excel
        </button>
    </div>
</div>

<script>
let zipPath = null;
let currentTaskId = null;

function setupDrop(dropId, inputId, onSuccess) {
    const drop = document.getElementById(dropId);
    const input = document.getElementById(inputId);

    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) uploadFile(file, drop, onSuccess);
    });
    input.addEventListener('change', () => {
        if (input.files[0]) uploadFile(input.files[0], drop, onSuccess);
    });
}

async function uploadFile(file, drop, onSuccess) {
    drop.classList.add('loading');
    const fd = new FormData();
    fd.append('file', file);
    try {
        const res = await fetch('/upload/zip', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.path) {
            drop.classList.remove('loading');
            drop.classList.add('success');
            document.getElementById('hint-zip').textContent = `✓ ${file.name}`;
            onSuccess(data.path);
        }
    } catch(e) {
        drop.classList.remove('loading');
        alert('Erro ao enviar arquivo: ' + e.message);
    }
}

setupDrop('drop-zip', 'file-zip', path => {
    zipPath = path;
    document.getElementById('btn-process').disabled = false;
});

async function processar() {
    if (!zipPath) return;
    const logBox  = document.getElementById('log-box');
    const btnDown = document.getElementById('btn-download');
    logBox.innerHTML = '';
    logBox.classList.add('active');
    btnDown.classList.remove('visible');
    document.getElementById('btn-process').disabled = true;

    const res = await fetch('/processar', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ zip_path: zipPath })
    });
    const task = await res.json();
    currentTaskId = task.task_id;

    const poll = setInterval(async () => {
        const s = await (await fetch(`/status/${currentTaskId}`)).json();
        logBox.innerHTML = s.log.map((l, i) => {
            const isLast = i === s.log.length - 1;
            const cls = s.status === 'ERROR' && isLast ? 'error' : (s.status === 'DONE' && isLast ? 'done' : '');
            return `<div class="log-line ${cls}">${l}</div>`;
        }).join('');
        logBox.scrollTop = logBox.scrollHeight;
        if (s.status === 'DONE' || s.status === 'ERROR') {
            clearInterval(poll);
            document.getElementById('btn-process').disabled = false;
            if (s.status === 'DONE') btnDown.classList.add('visible');
        }
    }, 1000);
}

function downloadFile() { window.location.href = `/download/${currentTaskId}`; }
</script>
</body>
</html>
